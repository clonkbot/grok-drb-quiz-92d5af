<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grok & $DRB Quiz - How Well Do You Know Grok?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Exo 2', sans-serif;
        background: #0a0a0a;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .font-orbitron { font-family: 'Orbitron', monospace; }
      .font-mono { font-family: 'Share Tech Mono', monospace; }
      
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
      }
      
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(255, 106, 0, 0.3), 0 0 40px rgba(255, 106, 0, 0.1); }
        50% { box-shadow: 0 0 30px rgba(255, 106, 0, 0.5), 0 0 60px rgba(255, 106, 0, 0.2); }
      }
      
      @keyframes text-flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.8; }
        94% { opacity: 1; }
        95% { opacity: 0.4; }
        96% { opacity: 1; }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes reveal {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }
      
      .animate-glitch:hover {
        animation: glitch 0.3s ease infinite;
      }
      
      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }
      
      .animate-flicker {
        animation: text-flicker 3s linear infinite;
      }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      
      .scanline::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(to bottom, transparent, rgba(255, 106, 0, 0.1), transparent);
        animation: scanline 4s linear infinite;
        pointer-events: none;
        z-index: 100;
      }
      
      .glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 106, 0, 0.2);
      }
      
      .text-gradient {
        background: linear-gradient(135deg, #ff6a00 0%, #ff8c00 50%, #ffb347 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .glow-text {
        text-shadow: 0 0 10px rgba(255, 106, 0, 0.8), 0 0 20px rgba(255, 106, 0, 0.4), 0 0 30px rgba(255, 106, 0, 0.2);
      }
      
      .btn-grok {
        background: linear-gradient(135deg, #ff6a00 0%, #ee5a00 100%);
        box-shadow: 0 0 20px rgba(255, 106, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
      }
      
      .btn-grok:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(255, 106, 0, 0.6), 0 10px 40px rgba(255, 106, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      
      .progress-bar {
        background: linear-gradient(90deg, #ff6a00, #ff8c00, #ffb347);
        box-shadow: 0 0 10px rgba(255, 106, 0, 0.5);
      }
      
      .option-btn {
        background: linear-gradient(135deg, rgba(255, 106, 0, 0.1) 0%, rgba(255, 106, 0, 0.05) 100%);
        border: 1px solid rgba(255, 106, 0, 0.3);
        transition: all 0.3s ease;
      }
      
      .option-btn:hover {
        background: linear-gradient(135deg, rgba(255, 106, 0, 0.2) 0%, rgba(255, 106, 0, 0.1) 100%);
        border-color: rgba(255, 106, 0, 0.6);
        transform: translateX(5px);
        box-shadow: 0 0 20px rgba(255, 106, 0, 0.2);
      }
      
      .option-btn.selected {
        background: linear-gradient(135deg, rgba(255, 106, 0, 0.4) 0%, rgba(255, 106, 0, 0.2) 100%);
        border-color: #ff6a00;
        box-shadow: 0 0 20px rgba(255, 106, 0, 0.4);
      }
      
      .grid-bg {
        background-image: 
          linear-gradient(rgba(255, 106, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 106, 0, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
      }
      
      .noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.03;
        z-index: 1000;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
